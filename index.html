<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />

  <style>
    body { font-family: 'Sarabun', sans-serif; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    .spinner { width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; display: inline-block; animation: spin .6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .ac-portal { position: fixed; z-index: 9999; left: 0; top: 0; width: 0; height: 0; }
    .ac-list { max-height: 280px; overflow: auto; background: #fff; border: 1px solid #e2e8f0; border-radius: 0.75rem; box-shadow: 0 10px 15px -3px rgb(0 0 0 / .1), 0 4px 6px -4px rgb(0 0 0 / .1); overscroll-behavior: contain; }
    .ac-item { padding: 0.6rem 1rem; cursor: pointer; transition: all .15s ease-in-out; border-left: 3px solid transparent; }
    .ac-item:hover, .ac-item.active { background: #EEF2FF; color: #1e1b4b; border-left-color: #4f46e5; }
    .ac-title { font-weight: 600; color: #1e293b; line-height: 1.3; font-size: 0.95rem; }
    .ac-sub { margin-top: 0.2rem; font-size: 0.85rem; color: #64748b; }
    .ac-empty { padding: 1rem; color: #64748b; text-align: center; }
    .hl { background: #c7d2fe; color: #3730a3; padding: 2px 4px; border-radius: 4px; font-weight: 500; }
    .hide-result { display: none; }
    summary { list-style: none; }
    summary::-webkit-details-marker { display: none; }
    details summary > * { display: inline-flex; }
    .advanced-col, .advanced-feature { display: none; }
    body.show-advanced .advanced-col { display: table-cell; }
    body.show-advanced .advanced-feature { display: block; }
    
    /* Custom Input Styles */
    .form-input { @apply w-full px-4 py-2.5 border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm transition-shadow duration-200; box-sizing: border-box; }
    /* 🛠️ แก้ไข: ล็อคขนาด input ให้ไม่ทะลุเซลล์ตารางด้วย display: block และ box-sizing: border-box */
    .table-input { @apply w-full min-w-0 bg-transparent px-2 py-1.5 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white rounded-md transition-all duration-200 border border-transparent focus:border-indigo-300; display: block; box-sizing: border-box; }
  </style>
</head>

                <input type="text" id="historySearch" class="w-full pl-9 pr-4 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm" placeholder="ค้นหาชื่อสินค้า, SKU...">

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
  /* ===== START: Firebase Integration ===== */
  const firebaseConfig = {
      apiKey: "AIzaSyC011yT8CHkS_BQ_tua2rYfwW86cFc-4oI",
      authDomain: "cost-calculator-app-ca65c.firebaseapp.com",
      databaseURL: "https://cost-calculator-app-ca65c-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "cost-calculator-app-ca65c",
      storageBucket: "cost-calculator-app-ca65c.appspot.com",
      messagingSenderId: "992180494210",
      appId: "1:992180494210:web:06f8619b8ddf1a6ef0b99b"
  };
  if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
  const auth = firebase.auth();
  const database = firebase.database();
  let logsRef;
  let currentUserId; 
  let currentDataListener = null;
  /* ===== END: Firebase Integration ===== */

  /* ===== CONFIG / STATE ===== */
  const HISTORY_LIMIT = 200, INV_KEY = 'inventoryDataV1';
  let INVENTORY = [];
  const INVENTORY_SOURCE_URL = 'https://raw.githubusercontent.com/kjakkrid1992-tech/loyverse-export-public/main/data/loyverse-price-latest.csv';
  let historySearch = '';
  let historyPage = 1;
  const HISTORY_PAGE_SIZE = 5;
  let ALL_LOGS_CACHE = [];

  /* ===== I18N mapping ===== */
  function i18nBillType(v){ if(v==='cash') return 'เงินสด'; if(v==='vat') return 'VAT'; return v||''; }
  function i18nVatMode(v){ if(v==='exclusive') return 'ยังไม่รวม VAT'; if(v==='inclusive') return 'รวม VAT'; return v||''; }
  function i18nDiscountType(v){ if(v==='baht') return 'บาท'; if(v==='percent') return '%'; return v||''; }

  /* ===== Button loading helper ===== */
  function setLoading(btn, on=true, labelWhenOff='<i data-lucide="save" class="w-4 h-4 mr-2"></i> บันทึกผลคำนวณ'){
    if(on){ btn.disabled=true; btn.dataset.label=btn.innerHTML; btn.innerHTML=`<span class="spinner mr-2"></span>กำลังบันทึก...`; }
    else { btn.disabled=false; btn.innerHTML=labelWhenOff; lucide.createIcons(); }
  }

  /* ===== INVENTORY ===== */
  function setInvStatus(t){ document.getElementById('invStatus').innerHTML='สถานะ: '+t; }
  (function initInventoryFromLocal(){ try{ const raw=localStorage.getItem(INV_KEY); if(raw){ const arr=JSON.parse(raw); if(Array.isArray(arr)){ INVENTORY=arr; setInvStatus(`โหลดจากเครื่องแล้ว ${INVENTORY.length.toLocaleString('th-TH')} รายการ`); } } }catch{} })();
  
  function clearInventory(){ showConfirm('ยืนยันล้างข้อมูล Inventory ทั้งหมด?',()=>{ INVENTORY=[]; localStorage.removeItem(INV_KEY); setInvStatus('ยังไม่โหลด'); showToast('ล้างข้อมูล Inventory แล้ว'); }); }
  function saveInventoryToLocal(){ try{ localStorage.setItem(INV_KEY, JSON.stringify(INVENTORY)); }catch{ console.warn('บันทึกไม่สำเร็จ (พื้นที่เต็ม)'); } }
  
  async function syncInventory(auto=false){ 
    try { 
      setInvStatus('กำลังซิงก์จาก GitHub...'); 
      const resp = await fetch(INVENTORY_SOURCE_URL,{cache:'no-store'}); 
      if(!resp.ok) throw new Error('HTTP '+resp.status); 
      const text = await resp.text(); 
      const rows = parseCSV(text)||[]; 
      if(!rows.length) throw new Error('ไฟล์ว่างหรือรูปแบบไม่ถูกต้อง'); 
      
      const headers = rows[0].map(h=>(h||'').toString().trim()); 
      const idx = { 
        sku: findHeader(headers,['sku','variant sku','item code','รหัสสินค้า']), 
        barcode: findHeader(headers,['barcode','bar code','บาร์โค้ด','บาร์โค๊ด']), 
        name: findHeader(headers,['item name','name','title','ชื่อสินค้า','สินค้า','item']), 
        cost: findHeader(headers,['cost','cost price','ต้นทุน']) 
      }; 
      if(idx.sku===-1 && idx.barcode===-1 && idx.name===-1) throw new Error('ไม่พบคอลัมน์ที่รองรับ (SKU/Barcode/Name)'); 
      
      const list = []; 
      for(let i=1; i<rows.length; i++){ 
        const r = rows[i]; 
        if(!r||!r.length) continue; 
        const sku = idx.sku>-1?(r[idx.sku]||'').toString().trim():''; 
        const barcode = idx.barcode>-1?(r[idx.barcode]||'').toString().trim():''; 
        const name = idx.name>-1?(r[idx.name]||'').toString().trim():''; 
        const cost = idx.cost>-1?(r[idx.cost]||'').toString().trim():''; 
        if(sku||barcode||name) list.push({barcode,sku,name,cost}); 
      } 
      INVENTORY = list; 
      saveInventoryToLocal(); 

      let commitDateText = nowStamp();
      let isOutdated = false;
      try {
        const repoApiUrl = 'https://api.github.com/repos/kjakkrid1992-tech/loyverse-export-public/commits?path=data/loyverse-price-latest.csv&page=1&per_page=1';
        const apiResp = await fetch(repoApiUrl);
        if (apiResp.ok) {
          const apiData = await apiResp.json();
          if (apiData && apiData.length > 0) {
            const commitDate = new Date(apiData[0].commit.committer.date);
            commitDateText = commitDate.toLocaleString('th-TH');
            
            const diffHours = (new Date() - commitDate) / (1000 * 60 * 60);

      lucide.createIcons();

  function parseCSV(text){ const rows=[]; let i=0,cur='',row=[],inq=false; while(i<text.length){ const ch=text[i]; if(inq){ if(ch=='"'){ if(text[i+1]=='"'){cur+='"';i++;} else inq=false; } else cur+=ch; } else{ if(ch=='"') inq=true; else if(ch==','){ row.push(cur); cur=''; } else if(ch=='\r'){ } else if(ch=='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; } else cur+=ch; } i++; } row.push(cur); rows.push(row); return rows.filter(r=>r.length && r.some(x=>(x||'').toString().trim()!='')); }

  function openACFor(input, items, query){ AC.input=input; AC.items=items; AC.active=-1; const rect=input.getBoundingClientRect(); const box=document.createElement('div'); box.className='ac-list'; box.style.position='fixed'; box.style.left=rect.left+'px'; box.style.top=(rect.bottom+4)+'px'; box.style.width=rect.width+'px'; if(!items.length){ box.innerHTML=`<div class="ac-empty">ไม่พบสินค้า</div>`; } else{ box.innerHTML=items.map((it,i)=>{ const title=it.name || it.sku || it.barcode || ''; const sub=(it.sku?`SKU ${it.sku}`:(it.barcode?`[${it.barcode}]`:'')) + (it.cost?` • ต้นทุน: ${n2(parseFloat(it.cost))}`:''); return `<div class="ac-item" data-i="${i}"><div class="ac-title">${highlight(title,query)}</div><div class="ac-sub">${highlight(sub,query)}</div></div>`; }).join(''); } AC.portal.innerHTML=''; AC.portal.appendChild(box); box.querySelectorAll('.ac-item').forEach((el,i)=> el.addEventListener('mousedown',e=>{ e.preventDefault(); applyItemToRow(items[i]); })); }

  function searchInv(q){ q=(q||'').trim(); if(!q||!INVENTORY.length) return []; const norm=s=>(s||'').toString().toLowerCase(); const qq=norm(q); const arr=[]; for(const it of INVENTORY){ const f1=norm(it.name), f2=norm(it.sku), f3=norm(it.barcode); let score=-1; if(f3.startsWith(qq)||f2.startsWith(qq)||f1.startsWith(qq)) score=0; else if(f3.includes(qq)||f2.includes(qq)||f1.includes(qq)) score=1; if(score>-1) arr.push([score,it]); } arr.sort((a,b)=>a[0]-b[0]); return arr.slice(0,12).map(x=>x[1]); }

  /* ===== Calculate ===== */
  function calculateAll(){ document.querySelectorAll('.border-red-500').forEach(el=>el.classList.remove('border-red-500','ring-red-500')); updateIndices(); const billType=document.getElementById('billType').value, priceVATMode=document.getElementById('priceVAT').value; validateShipping(); const totalShip=noShipCheckbox.checked?0:(parseFloat((totalShipInput.value||'').replace(/,/g,''))||0); const discountType = document.getElementById('discountType').value; const totalDiscountValue = parseFloat((document.getElementById('totalDiscount').value || '').replace(/,/g,'')) || 0; const rows=Array.from(document.querySelectorAll('#calcTable tbody tr')); const qtys=rows.map(r=>parseInt((r.querySelector('.qty').value||'').replace(/,/g,''))||0); const prices=rows.map(r=>parseFloat((r.querySelector('.totalPrice').value||'').replace(/,/g,''))||0); const itemDiscounts = rows.map(r => parseFloat((r.querySelector('.itemDiscount').value || '').replace(/,/g, '')) || 0); const subtotal = prices.reduce((a, b) => a + b, 0); let totalDiscountAmount = 0; if (discountType === 'percent' && totalDiscountValue > 0 && subtotal > 0) { totalDiscountAmount = subtotal * (totalDiscountValue / 100); } else if (discountType === 'baht') { totalDiscountAmount = totalDiscountValue; } let vatFactor=1; if(billType==='vat') vatFactor=(priceVATMode==='exclusive')?1.07:1; rows.forEach((row,i)=>{ const D=qtys[i], E=prices[i], I=itemDiscounts[i]; const shipRowCell=row.querySelector('.shipRow'), shipCell=row.querySelector('.shipShare'), resultCell=row.querySelector('.result'); let valid=true; if(D<=0||!Number.isInteger(D)){ if(row.querySelector('.qty').value) {row.querySelector('.qty').classList.add('border-red-500','ring-red-500'); valid=false;} } if(E<0){ if(row.querySelector('.totalPrice').value) {row.querySelector('.totalPrice').classList.add('border-red-500','ring-red-500'); valid=false;} } if(!valid||rows.length===0){ shipRowCell.innerText='-'; shipCell.innerText='-'; resultCell.innerHTML='-'; resultCell.classList.add('hide-result'); return; } let perRowShip = rows.length > 0 ? totalShip / rows.length : 0; shipRowCell.innerText=n2(perRowShip,2); const perItemShip=D>0? perRowShip/D:0; shipCell.innerText=n2(perItemShip,2); const billDiscountShare = (subtotal > 0) ? (E / subtotal) * totalDiscountAmount : 0; const priceAfterDiscount = E - I - billDiscountShare; const net = D > 0 ? ((priceAfterDiscount * vatFactor) + perRowShip)/D : 0; if(D>0 && E>=0){ const oldCost = parseFloat(row.dataset.cost); let resultHtml = n2(net, 2); if (!isNaN(oldCost) && oldCost > 0) { if (net > oldCost) { resultHtml += ' <span class="text-red-500 inline-flex items-center ml-1"><i data-lucide="trending-up" class="w-3 h-3"></i></span>'; } else if (net < oldCost) { resultHtml += ' <span class="text-emerald-500 inline-flex items-center ml-1"><i data-lucide="trending-down" class="w-3 h-3"></i></span>'; } } resultCell.innerHTML = resultHtml; resultCell.classList.remove('hide-result'); } else { resultCell.innerHTML='-'; resultCell.classList.add('hide-result'); } }); lucide.createIcons(); if(typeof renderHistoryTable === 'function') renderHistoryTable(); }

  document.getElementById('historySearch').addEventListener('input', (e) => { historySearch = e.target.value; historyPage = 1; renderHistoryTable(); });
  function changeHistoryPage(delta) { historyPage += delta; renderHistoryTable(); }
  function renderHistoryTable(){ const el=document.getElementById('historySection'); const paginationEl = document.getElementById('historyPagination'); if(!currentUserId) { el.innerHTML='<div class="text-center text-slate-400 py-10 flex flex-col items-center"><i data-lucide="lock" class="w-10 h-10 mb-3 opacity-50"></i><p>กรุณาล็อกอินเพื่อดูประวัติ</p></div>'; lucide.createIcons(); paginationEl.innerHTML=''; return; } const filteredLogs = ALL_LOGS_CACHE.filter(log => { if (!historySearch) return true; const searchTerm = historySearch.toLowerCase(); const tsMatch = log.ts.toLowerCase().includes(searchTerm); const itemMatch = (log.rows || []).some(r => (r.name || '').toLowerCase().includes(searchTerm) || (r.sku || '').toLowerCase().includes(searchTerm) || (r.findText || '').toLowerCase().includes(searchTerm) ); return tsMatch || itemMatch; }); if(!filteredLogs.length){ el.innerHTML='<div class="text-center text-slate-400 py-10"><i data-lucide="search-x" class="w-10 h-10 mx-auto mb-3 opacity-50"></i><p>ไม่พบประวัติที่ตรงกัน</p></div>'; lucide.createIcons(); paginationEl.innerHTML = ''; return; } const totalPages = Math.ceil(filteredLogs.length / HISTORY_PAGE_SIZE); if (historyPage < 1) historyPage = 1; if (historyPage > totalPages) historyPage = totalPages; const startIndex = (historyPage - 1) * HISTORY_PAGE_SIZE; const logsToShow = filteredLogs.slice(startIndex, startIndex + HISTORY_PAGE_SIZE); let html=''; logsToShow.forEach((log)=>{ const logId = log.id; const rows = log.rows || []; const itemRows = rows.map((r,i)=>{ return `<tr class="border-t border-slate-100 hover:bg-slate-50 transition-colors"><td class="px-3 py-2 text-slate-400 text-center text-xs whitespace-nowrap">${i+1}</td><td class="px-3 py-2 break-words font-medium min-w-[200px]">${[r.name, r.sku?`SKU ${r.sku}`:null].filter(Boolean).join(' • ') || (r.findText||'-')}</td><td class="px-3 py-2 text-right whitespace-nowrap">${r.qty}</td><td class="px-3 py-2 text-right whitespace-nowrap">${r.price}</td><td class="px-3 py-2 text-right text-red-500 whitespace-nowrap">${r.itemDiscount || '-'}</td><td class="px-3 py-2 text-right text-slate-500 whitespace-nowrap">${n2(parseFloat(r.cost),2)}</td><td class="px-3 py-2 text-right font-bold text-indigo-700 bg-indigo-50/30 whitespace-nowrap">${r.result}</td></tr>`; }).join(''); const discountVal = (log.totalDiscount||''); const discountText = discountVal ? `<span class="bg-red-50 text-red-600 px-2 py-0.5 rounded text-xs ml-2 whitespace-nowrap">ส่วนลด ${discountVal} ${i18nDiscountType(log.discountType)}</span>` : ''; const summaryLine = `บิล: <span class="font-medium">${i18nBillType(log.billType)}</span> • VAT: <span class="font-medium">${i18nVatMode(log.priceVAT)}</span> • ค่าส่ง: <span class="font-medium">${log.totalShip||'0'}</span> ${discountText}`; html += `<div class="bg-white rounded-xl border border-slate-200 mb-5 overflow-hidden shadow-sm"><div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 bg-slate-50 px-4 py-3 border-b border-slate-100"><div><div class="text-slate-800 font-bold flex items-center gap-2"><i data-lucide="clock" class="w-4 h-4 text-slate-400"></i> ${log.ts}</div><div class="text-xs text-slate-500 mt-1">${summaryLine}</div></div><div class="flex items-center gap-2 w-full sm:w-auto"><button onclick="showPrintReceiptFromLog('${logId}')" class="flex-1 sm:flex-none inline-flex items-center justify-center px-3 py-1.5 bg-white border border-slate-200 rounded-lg text-xs font-semibold text-slate-700 hover:bg-slate-100 transition-colors"><i data-lucide="printer" class="w-3 h-3 mr-1.5"></i> พิมพ์</button><button onclick="deleteLog('${logId}')" class="flex-1 sm:flex-none inline-flex items-center justify-center px-3 py-1.5 bg-white border border-red-200 rounded-lg text-xs font-semibold text-red-600 hover:bg-red-50 transition-colors"><i data-lucide="trash" class="w-3 h-3 mr-1.5"></i> ลบ</button></div></div><div class="overflow-x-auto"><table class="w-full text-xs md:text-sm table-auto min-w-[800px]"><thead><tr class="bg-white text-slate-500"><th class="px-3 py-2 text-center font-medium w-10 whitespace-nowrap">#</th><th class="px-3 py-2 text-left font-medium whitespace-nowrap">สินค้า</th><th class="px-3 py-2 text-right font-medium whitespace-nowrap">จำนวน</th><th class="px-3 py-2 text-right font-medium whitespace-nowrap">ราคารวม</th><th class="px-3 py-2 text-right font-medium whitespace-nowrap">ส่วนลด</th><th class="px-3 py-2 text-right font-medium whitespace-nowrap">ทุนเดิม</th><th class="px-3 py-2 text-right font-semibold text-indigo-900 bg-indigo-50/30 whitespace-nowrap">ทุนใหม่</th></tr></thead><tbody>${itemRows}</tbody></table></div></div>`; }); el.innerHTML=html; let paginationHtml = `<button onclick="changeHistoryPage(-1)" class="px-4 py-2 border rounded-lg font-medium transition-colors ${historyPage === 1 ? 'bg-slate-50 text-slate-300 border-slate-100 cursor-not-allowed' : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-50'}" ${historyPage === 1 ? 'disabled' : ''}>ก่อนหน้า</button><span class="bg-slate-100 px-4 py-2 rounded-lg text-slate-600">หน้า ${historyPage} / ${totalPages}</span><button onclick="changeHistoryPage(1)" class="px-4 py-2 border rounded-lg font-medium transition-colors ${historyPage === totalPages ? 'bg-slate-50 text-slate-300 border-slate-100 cursor-not-allowed' : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-50'}" ${historyPage === totalPages ? 'disabled' : ''}>ถัดไป</button>`; paginationEl.innerHTML = totalPages > 1 ? paginationHtml : ''; lucide.createIcons(); }
  function deleteLog(logId){ showConfirm('ยืนยันลบประวัติรายการนี้?',()=>{ logsRef.child(logId).remove().then(() => showToast('ลบข้อมูลสำเร็จ')).catch((err) => showAlert('เกิดข้อผิดพลาด: ' + err.message)); }); }
  function showPrintReceiptFromLog(logId){ const body=`<div class="text-center"><div class="w-12 h-12 bg-indigo-100 rounded-full flex items-center justify-center mx-auto mb-4"><i data-lucide="printer" class="w-6 h-6 text-indigo-600"></i></div><div class="text-xl font-bold text-slate-800 mb-2">เลือกรูปแบบการพิมพ์</div><p class="text-sm text-slate-500 mb-6">กรุณาเลือกขนาดกระดาษที่ต้องการพิมพ์ใบสรุปต้นทุน</p></div><div class="flex gap-3"><button onclick="printReceipt('${logId}','A4')" class="flex-1 inline-flex flex-col items-center justify-center p-4 bg-white border-2 border-slate-200 rounded-xl hover:border-indigo-500 hover:bg-indigo-50 transition-all"><i data-lucide="file-text" class="w-8 h-8 mb-2 text-slate-600"></i><span class="font-semibold text-slate-800">ขนาด A4</span></button><button onclick="printReceipt('${logId}','58mm')" class="flex-1 inline-flex flex-col items-center justify-center p-4 bg-white border-2 border-slate-200 rounded-xl hover:border-indigo-500 hover:bg-indigo-50 transition-all"><i data-lucide="receipt" class="w-8 h-8 mb-2 text-slate-600"></i><span class="font-semibold text-slate-800">สลิป 58mm</span></button></div>`; document.getElementById('popupBody').innerHTML = body; lucide.createIcons(); showPopup(); }
  function printReceipt(logId, mode) { logsRef.child(logId).once('value', (snapshot) => { const log = snapshot.val(); if (!log) { showAlert('ไม่พบข้อมูลที่จะพิมพ์'); return; } const tableHeader = `<thead><tr style="border-bottom:2px solid #cbd5e1;"><th style="padding:8px 4px;text-align:left;color:#475569;">#</th><th style="padding:8px 4px;text-align:left;color:#475569;">สินค้า</th><th style="padding:8px 4px;text-align:right;color:#475569;">จำนวน</th><th style="padding:8px 4px;text-align:right;color:#475569;">ราคารวม</th><th style="padding:8px 4px;text-align:right;color:#475569;">ส่วนลด</th><th style="padding:8px 4px;text-align:right;color:#475569;">ทุน(เดิม)</th><th style="padding:8px 4px;text-align:right;font-weight:bold;color:#1e1b4b;">ทุน(ใหม่)</th></tr></thead>`; const tableBody = log.rows.map((r,i)=>{ if (!r.qty || r.result === '-') return ''; const nameBits=[r.name, r.sku?`SKU ${r.sku}`:null, r.barcode?`[${r.barcode}]`:null].filter(Boolean).join(' • ') || (r.findText||'-'); return `<tr style="border-bottom:1px solid #f1f5f9;"><td style="padding:8px 4px;text-align:left;vertical-align:top;color:#64748b;">${i+1}</td><td style="padding:8px 4px;text-align:left;vertical-align:top;font-weight:500;">${nameBits}</td><td style="padding:8px 4px;text-align:right;vertical-align:top;">${r.qty}</td><td style="padding:8px 4px;text-align:right;vertical-align:top;">${r.price}</td><td style="padding:8px 4px;text-align:right;vertical-align:top;color:#ef4444;">${r.itemDiscount || '-'}</td><td style="padding:8px 4px;text-align:right;vertical-align:top;color:#64748b;">${n2(parseFloat(r.cost))}</td><td style="padding:8px 4px;text-align:right;vertical-align:top;font-weight:bold;font-size:1.1em;color:#3730a3;">${r.result}</td></tr>`; }).join(''); const rowsHtml = `<table style="width:100%;border-collapse:collapse;font-size:inherit;">${tableHeader}<tbody>${tableBody}</tbody></table>`; const discountVal = (log.totalDiscount||'').toString().replace(/,/g,''); const discountText = discountVal ? `<div style="color:#ef4444;font-weight:500;">ส่วนลดท้ายบิล: ${n2(discountVal, 2)} ${i18nDiscountType(log.discountType)}</div>` : ''; let html,style; if(mode==='A4'){ style=`<style>body{font-family:'Sarabun',Arial,sans-serif;font-size:11pt;margin:40px;color:#0f172a;}h3{margin:0 0 16px;font-size:24pt;color:#1e1b4b;border-bottom:2px solid #e2e8f0;padding-bottom:10px;}.hr{border-top:1px dashed #cbd5e1;margin:20px 0} table{font-size:10pt;} .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;background:#f8fafc;padding:15px;border-radius:8px;}</style>`; html=`<h3>ใบสรุปต้นทุนสินค้าเข้า</h3><div class="info-grid"><div><strong>เวลาบันทึก:</strong> ${log.ts}</div><div><strong>ประเภทบิล:</strong> ${i18nBillType(log.billType)} (${i18nVatMode(log.priceVAT)})</div><div><strong>ค่าขนส่งรวม:</strong> ${n2((log.totalShip||'').toString().replace(/,/g,''),2)} บาท</div>${discountText}</div>${rowsHtml}<div class="hr"></div><div style="font-size:9pt;color:#94a3b8;text-align:center;">เอกสารใช้สำหรับภายในร้านเท่านั้น • สร้างโดยระบบคำนวณต้นทุน Pro</div>`; }else{ style=`<style>body{font-family:'Sarabun',monospace;font-size:12px;margin:0;width:300px;color:#000;} .header-info div{margin-bottom:4px;} .hr{border-top:1px dashed #000;margin:10px 0} table{font-size:11px;width:100%;} th,td{padding:4px 2px;}</style>`; html=`<div class="receipt"><div style="text-align:center;font-weight:bold;font-size:16px;margin-bottom:10px;">สรุปต้นทุน</div><div class="header-info"><div>เวลา: ${log.ts}</div><div>บิล: ${i18nBillType(log.billType)} (${i18nVatMode(log.priceVAT)})</div><div>ค่าส่ง: ${n2((log.totalShip||'').toString().replace(/,/g,''),2)}</div>${discountText.replace('ท้ายบิล','')}</div><div class="hr"></div>${rowsHtml.replace(/style="[^"]*"/g, '')}</div>`; } const w=window.open('','','width=800,height=900'); w.document.write('<html><head><title>สรุปต้นทุน</title><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;700&display=swap" rel="stylesheet">'+style+'</head><body>'+html+'</body></html>'); w.document.close(); w.focus(); setTimeout(()=>w.print(),800); closePopup(); }); }
  
  /* ===== Auth and App Init ===== */
  const loginBtn = document.getElementById('login-btn');
  const logoutBtn = document.getElementById('logout-btn');
  const userInfoDiv = document.getElementById('user-info');
  const mainContent = document.getElementById('main-content');

  function signInWithGoogle() {
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).catch(error => { console.error("Login failed:", error); showAlert("Login ไม่สำเร็จ: " + error.message); });
  }

  function signOut() {
    auth.signOut();
  }

  auth.onAuthStateChanged(user => {
    if (user) {
      currentUserId = user.uid;
      logsRef = database.ref(`costLogs/${currentUserId}`);
      userInfoDiv.innerHTML = `ผู้ใช้งาน: <span class="font-bold text-indigo-700">${user.displayName || user.email}</span>`;
      loginBtn.classList.add('hidden');
      logoutBtn.classList.remove('hidden');
      mainContent.classList.remove('hidden');
      mainContent.classList.add('animate-fade-in');
      startDataListener();
    } else {
      currentUserId = null;
      if (currentDataListener && logsRef) {
        logsRef.off('value', currentDataListener);
      }
      ALL_LOGS_CACHE = [];
      renderHistoryTable();
      userInfoDiv.innerText = 'กรุณาล็อกอินเพื่อใช้งานระบบ';
      loginBtn.classList.remove('hidden');
      logoutBtn.classList.add('hidden');
      mainContent.classList.add('hidden');
    }
  });

  function startDataListener() {
    if (!logsRef) return;
    if (currentDataListener) {
      logsRef.off('value', currentDataListener);
    }
    currentDataListener = logsRef.orderByChild('createdAt').limitToLast(HISTORY_LIMIT).on('value', (snapshot) => {
        const logsData = snapshot.val();
        ALL_LOGS_CACHE = logsData ? Object.keys(logsData).map(key => ({ id: key, ...logsData[key] })).reverse() : [];
        renderHistoryTable();
    }, (error) => {
        console.error("Data listener error:", error);
        showAlert("ไม่สามารถโหลดข้อมูลประวัติได้: " + error.message);
    });
  }
  
  function initApp(){
    lucide.createIcons();
    togglePriceVAT();
    addRow();
    bindInputs();
    validateShipping();
    syncInventory(true);
  }

  initApp();
</script>
<style>
  .animate-fade-in { animation: fadeIn 0.4s ease-in-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
</style>
</body>
